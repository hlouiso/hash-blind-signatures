[package]
name = "blind-xmss-binius64"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "blind_xmss_binius64"
path = "src/lib.rs"

bench = false

[[bin]]
name = "blindsig"
path = "src/bin/blindsig.rs"
bench = false

[dependencies]
binius-circuits  = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-compute   = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-core      = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-field     = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-frontend  = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-hash      = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-hash-prover = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-iop       = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-iop-prover = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-ip        = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-ip-prover = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-math      = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-prover    = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-spartan-frontend = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-spartan-prover = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-spartan-verifier = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-transcript = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-utils     = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }
binius-verifier  = { git = "https://github.com/binius-zk/binius64.git", rev = "4428e759dd27956bd5b9ae5025d67eb8ccc1accf" }

anyhow  = "1"
blake3  = "1"
digest  = "0.11.2"

rayon   = "1"

rand                = "0.10"

serde   = { version = "1", features = ["derive"] }
bincode = "1"

[dev-dependencies]
hex = "0.4"

[[bench]]
name    = "bench"
harness = false

[profile.bench]
opt-level = 3
lto       = "thin"

[profile.release]
opt-level = 3
lto       = "thin"
debug     = false

[profile.dev]
opt-level = 1
