name: longfellow

on:
  push:
    branches: [main]
    paths: ['longfellow/**', '.github/workflows/longfellow.yml']
  pull_request:
    paths: ['longfellow/**', '.github/workflows/longfellow.yml']
  workflow_dispatch:

concurrency:
  group: longfellow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Locate OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S longfellow -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build -j

      - name: Enlarge swap (Linux)
        if: runner.os == 'Linux'
        run: |
          SWAP_FILE=$(swapon --show=NAME --noheadings | head -n1)
          SWAP_FILE=${SWAP_FILE:-/mnt/swapfile}
          sudo swapoff "$SWAP_FILE" || true
          sudo rm -f "$SWAP_FILE"
          sudo fallocate -l 16G "$SWAP_FILE"
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE"
          sudo swapon "$SWAP_FILE"
          free -h

      - name: Test
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            ulimit -s 65536 || true
          fi
          ctest --test-dir build --output-on-failure
